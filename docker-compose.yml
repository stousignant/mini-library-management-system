version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/library_dev
      PYTHONUNBUFFERED: 1
      SUPABASE_JWT_SECRET: local-development-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: library-frontend
    ports:
      - "5173:5173"
    environment:
      # Frontend runs in browser, so API URL must use host-accessible address
      # Use localhost:8000 (not 'backend:8000') since browser resolves URLs
      VITE_API_URL: http://localhost:8000
      # Supabase configuration - Replace with your actual Supabase project values
      # Get these from: https://supabase.com/dashboard/project/YOUR_PROJECT/settings/api
      VITE_SUPABASE_URL: ${SUPABASE_URL:-https://your-project.supabase.co}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key-here}
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
